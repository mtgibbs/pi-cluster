# secrets-overlay.yaml — the curated ~10% that gen-secrets-graph.mjs CANNOT
# derive from a pod-spec walk. Everything else in docs/secrets-map.md's graph
# is regenerated from clusters/**; only edit here what a manifest walk can't see.
#
# Flat two-section format (parsed without a YAML lib — keep it simple):
#   consumers:  "<namespace>/<k8s-secret>": <who really consumes it, and how>
#   tier:       "<1Password item>": safe | cluster-acting | crown-jewel
#
# When the graph shows "⚠️ no consumer found in-repo" for a secret that IS in
# use, add its real consumer here. Verified 2026-08-01 by grepping the repo.

consumers:
  # Consumed by a HelmRelease `values:` / `existingSecret` — invisible to a pod-spec walk.
  monitoring/grafana-secret: kube-prometheus-stack HelmRelease (grafana.admin existingSecret)
  monitoring/alertmanager-discord: kube-prometheus-stack HelmRelease (Alertmanager Discord receiver, valuesFrom)
  monitoring/alertmanager-healthchecks: kube-prometheus-stack HelmRelease (Alertmanager watchdog ping, valuesFrom)
  tailscale/operator-oauth: tailscale-operator HelmRelease (OAuth client for the operator)
  # Consumed by a controller reference, not a workload pod spec.
  cert-manager/cloudflare-api-token: cert-manager ClusterIssuer (DNS01 apiTokenSecretRef)
  flux-system/discord-webhook: Flux notification-controller (Provider in flux-notifications/)
  flux-system/ghcr-pull-secret: Flux source/kustomize/helm controllers (ghcr.io/mtgibbs registry auth)
  flux-system/nfs-credentials: Flux Kustomizations (postBuild.substituteFrom NAS uid/gid, 4 refs in infrastructure.yaml)
  # Wired inside the app's own config, not a manifest env ref — verify in-app.
  media/newshosting-credentials: SABnzbd server config (app-internal; NOT a manifest ref — verify or prune)
  media/opensubtitles-credentials: Bazarr provider config (app-internal; NOT a manifest ref — verify or prune)
  media/calibre-web-smtp: calibre-web SMTP config (app-internal env; verify)

# Handling tier — who/what may touch a cred (see docs/secrets-map.md "Handling tiers").
# Only the non-default ones are tagged; untagged = ordinary per-workload app secret.
tier:
  ghcr-read-token: safe
  mcp-homelab: cluster-acting
  synology_backup: crown-jewel
  nas: crown-jewel
