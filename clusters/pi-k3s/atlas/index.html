#panels button:hover{background:#32323c}
#panels select{background:#26262e;color:#ccc;border:1px solid #3a3a44;border-radius:4px;padding:2px 6px}
.ambient #panels,.ambient #legend{display:none}
.ambient #c{cursor:none}

  for (const n of N) {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < Math.max(n.r * P.nodeSize + 4 / scale, 9 / scale) && d < bd) { best = n; bd = d; }
  }
  return best;
}
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  moved = 0; px = ev.clientX; py = ev.clientY;
  dragNode = pick(ev);
  panning = !dragNode;
});
cv.addEventListener("pointermove", ev => {
  moved += Math.abs(ev.clientX - px) + Math.abs(ev.clientY - py);
  if (dragNode) {
    const [wx, wy] = world(ev);
    dragNode.x = wx; dragNode.y = wy; dragNode.vx = 0; dragNode.vy = 0;
    alpha = Math.max(alpha, 0.25);
  } else if (panning) { tx += ev.clientX - px; ty += ev.clientY - py; }
  px = ev.clientX; py = ev.clientY;
  hoverNode = (dragNode || panning) ? hoverNode : pick(ev);
  if (hoverNode && !panning) {
    tip.style.display = "block";
    tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY + 14) + "px";
    tip.textContent = hoverNode.stem + "  [" + hoverNode.short + "]  " +
      hoverNode.conn + " links (" + (hoverNode.deg || 0) + " inbound)" +
      (hoverNode.gold ? " · identity" : "") + (hoverNode.dead ? " · EXPIRED" : "") +
      (hoverNode.gates.size ? " · gates → " +
        [...hoverNode.gates].map(rn => realms.get(rn).short).join(", ") : "");
  } else tip.style.display = "none";
});
cv.addEventListener("pointerup", ev => {
  if (moved < 5) {
    const n = pick(ev);
    if (n) location.href = "obsidian://open?vault=" + encodeURIComponent(DATA.vault) +
      "&file=" + encodeURIComponent(n.realm + "/memory/" + n.stem);
  }
  dragNode = null; panning = false;
});
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY * 0.0015);
  const [wx, wy] = world(ev);
  scale *= f;
  tx = ev.clientX - wx * scale; ty = ev.clientY - wy * scale;
}, { passive: false });

// ---- slider panel ---------------------------------------------------------
const ctrl = document.getElementById("ctrl");
function saveParams() {
  try { localStorage.setItem("forcemap-params", JSON.stringify(P)); } catch (e) {}
}
const refs = {};
for (const [key, name, min, max, step, fmt] of SLIDERS) {
  const lab = document.createElement("label");
  lab.innerHTML = "<span>" + name + "</span><input type=range min=" + min +
    " max=" + max + " step=" + step + "><span class=val></span>";
  const inp = lab.querySelector("input"), val = lab.querySelector(".val");
  refs[key] = { inp, val, fmt };
  inp.value = P[key]; val.textContent = fmt(P[key]);
  inp.addEventListener("input", () => {
    P[key] = +inp.value; val.textContent = fmt(P[key]);
    if (key === "corridor") relayout();
    alpha = Math.max(alpha, 0.5); saveParams();
  });
  ctrl.appendChild(lab);
}
const disp = document.getElementById("disp");
const rlLab = document.createElement("label");
rlLab.innerHTML = "<span>realm labels</span><input type=checkbox>";
const rlBox = rlLab.querySelector("input");
rlBox.checked = P.realmLabels;
rlBox.addEventListener("change", () => { P.realmLabels = rlBox.checked; saveParams(); });
disp.appendChild(rlLab);
const grLab = document.createElement("label");
grLab.innerHTML = "<span>gate rings</span><input type=checkbox>";
const grBox = grLab.querySelector("input");
grBox.checked = P.gateRings;
grBox.addEventListener("change", () => { P.gateRings = grBox.checked; saveParams(); });
disp.appendChild(grLab);
const labLab = document.createElement("label");
labLab.innerHTML = "<span>note labels</span><select>" +
  ["hover", "hubs", "all"].map(m => "<option value=" + m + ">" + m + "</option>").join("") +
  "</select>";
const labSel = labLab.querySelector("select");
labSel.value = P.labels;
labSel.addEventListener("change", () => { P.labels = labSel.value; saveParams(); });
disp.appendChild(labLab);
const rb = document.createElement("button");
rb.textContent = "reset";
rb.addEventListener("click", () => {
  Object.assign(P, DEFAULTS); relayout(); saveParams();
  for (const [key] of SLIDERS) {
    refs[key].inp.value = P[key];
    refs[key].val.textContent = refs[key].fmt(P[key]);
  }
  labSel.value = P.labels;
  rlBox.checked = P.realmLabels;
  grBox.checked = P.gateRings;
  alpha = Math.max(alpha, 0.5);
});
ctrl.appendChild(rb);

// ---- ambient attract loop -------------------------------------------------
if (AMBIENT) {
  const interesting = N.filter(n => n.conn >= 3);
  const aim = node => {
    if (node) {
      tgtS = Math.min(baseS * 3, 1.6);
      tgtX = innerWidth / 2 - node.x * tgtS;
      tgtY = innerHeight / 2 - node.y * tgtS;
    } else { tgtS = baseS; tgtX = baseX; tgtY = baseY; }
  };
  let beat = 0;
  setInterval(() => {
    beat++;
    if (beat % 4 === 0) { hoverNode = null; aim(null); }   // step back for the wide shot
    else {
      hoverNode = interesting[Math.floor(Math.random() * interesting.length)] || N[0];
      aim(hoverNode);
    }
    alpha = Math.max(alpha, 0.08);            // keep a little motion in the fields
  }, 18000);
  aim(null);
}

requestAnimationFrame(draw);
</script></body></html>
