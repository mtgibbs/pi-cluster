# Two creds, sourced by the rule in CLAUDE.md: reuse a shared identity, mint only
# what is genuinely per-workload.
#
#   ntfy-password  — REUSED. The shared `family` ntfy identity, same item n8n and
#                    Vector publish with. A digest push is not a new role.
#   litellm-key    — MINTED. A LiteLLM virtual key is the one per-workload case the
#                    rule calls out: it carries this job's own model allowlist and
#                    rate limits, so model-watch cannot reach anything else.
#
# PREREQ: the `model-watch/litellm-key` 1Password item must exist before this syncs.
# Mint it with LiteLLM /key/generate scoped to the digest model only. Until then this
# ExternalSecret stays NotReady and the Kustomization reports FAILED — same shape as
# new-horizons (see docs/model-onboarding.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-watch-secret
  namespace: model-watch
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: model-watch-secret
    creationPolicy: Owner
  data:
    - secretKey: litellm-api-key
      remoteRef:
        key: model-watch/litellm-key
    - secretKey: ntfy-password
      remoteRef:
        key: ntfy/family-password
