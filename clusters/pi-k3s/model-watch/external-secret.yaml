apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-watch-secrets
  namespace: model-watch
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: model-watch-secret
    creationPolicy: Owner
  data:
    # LiteLLM virtual key (scoped to allowed chat models only).
    - secretKey: litellm-api-key
      remoteRef:
        key: model-watch/litellm-key
    # ntfy password for the family topic
    - secretKey: ntfy-password
      remoteRef:
        key: ntfy/family-password