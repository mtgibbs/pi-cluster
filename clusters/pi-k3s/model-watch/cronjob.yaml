apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-watch
  namespace: model-watch
spec:
  schedule: "0 0 1 * *"  # Run at midnight on the first day of each month
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: model-watch
              image: python:3.12-slim
              command:
                - /usr/local/bin/python3
                - /app/model-watch.py
              env:
                - name: PYTHONPATH
                  value: /app
                - name: DRY_RUN
                  value: "0"
                - name: WINDOW_DAYS
                  value: "45"
                - name: MIN_LIKES
                  value: "40"
                - name: VRAM_BUDGET_GB
                  value: "96"
              volumeMounts:
                - name: app
                  mountPath: /app
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "100m"
          volumes:
            - name: app
              configMap:
                name: model-watch-cm
          restartPolicy: Never