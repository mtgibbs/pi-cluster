# Copied VERBATIM from clusters/pi-k3s/harness/external-secret-ghcr.yaml, changing only the
# namespace — which is the whole point. This mints NO new credential: one 1Password item
# (ghcr-read-token) is the entire cluster's "pull private packages" identity, materialized as a
# namespaced ghcr-pull-secret wherever a private image lands. Flux image-automation, private-exit-node
# and the harness coordinator all pull with this same token; a second one would be a second thing to
# rotate and a second thing to forget to rotate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: harness-fleet
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"mtgibbs","password":"{{ .token }}","auth":"{{ printf "mtgibbs:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-read-token/token
