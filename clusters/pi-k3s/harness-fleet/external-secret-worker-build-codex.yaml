# The credentials a build-codex worker gets — and, pointedly, NOT the LiteLLM key.
#
# Same shape as external-secret-worker-build-converge.yaml, one provider key different, and that
# difference is the entire argument for one secret per strategy. build-codex drives the `codex` CLI
# (scripts/exec-codex.sh in mtgibbs/harness); it never calls LiteLLM, so it does not hold the key
# that would let it. The harness resolves HARNESS_WORKER_SECRET_BUILD_CODEX ->
# HARNESS_WORKER_SECRET -> nothing, never a sibling strategy's, so the dispatcher selects this one
# with HARNESS_WORKER_SECRET_BUILD_CODEX=harness-worker-build-codex.
#
# NOTHING here can launch compute. The dispatch API token — the one identity that can create Jobs —
# lives with the coordinator and is deliberately absent: a worker that can start more workers turns
# one compromise into a fleet.
#
# The report token, the clone token and the outcome PAT are the SAME items build-converge uses, and
# that is right: they are per-role identities, not per-strategy ones. Only the provider key varies,
# because only the provider varies. The reuse-vs-mint reasoning for all four lives in the sibling
# file's header; docs/secrets-map.md was walked before any of them.
#
# OPENAI_API_KEY rather than a HARNESS_-prefixed name: exec-codex.sh acquires nothing and execs the
# vendor CLI, which reads its own variable. That is the contract in mtgibbs/harness docs/executors.md
# — the provider key is "whatever your CLI reads".
# harness-fleet/outcome-pat is a fine-grained PAT with Contents: RW, Pull requests: RW and
# Workflows: RW — the last decided 2026-08-30 so a worker can land changes under .github/workflows/.
# It still may not create compute. harness-fleet/clone-token is Contents: read and nothing else.
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-worker-build-codex
  namespace: harness-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harness-worker-build-codex
    creationPolicy: Owner
    template:
      data:
        # Not a secret, but it travels with them: the worker gets its whole environment from one
        # envFrom, and the coordinator is reached in-cluster rather than back out through ingress.
        HARNESS_REPORT_URL: "http://harness-coordinator.harness.svc.cluster.local:8877"
        HARNESS_REPORT_TOKEN: "{{ .report_token }}"
        OPENAI_API_KEY: "{{ .codex_api_key }}"
        HARNESS_CLONE_TOKEN: "{{ .clone_token }}"
        HARNESS_OUTCOME_PAT: "{{ .outcome_pat }}"
  data:
    - secretKey: report_token
      remoteRef:
        key: harness-coordinator/token
    - secretKey: codex_api_key
      remoteRef:
        key: harness-fleet/codex-api-key
    - secretKey: clone_token
      remoteRef:
        key: harness-fleet/clone-token
    - secretKey: outcome_pat
      remoteRef:
        key: harness-fleet/outcome-pat
