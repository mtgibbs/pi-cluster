# The credentials a build-converge worker gets — and nothing a build-converge worker does not use.
#
# One secret PER STRATEGY, not one shared blob. The harness resolves
# HARNESS_WORKER_SECRET_<STRATEGY_UPPER_SNAKE> -> HARNESS_WORKER_SECRET -> nothing, never a
# sibling strategy's, so `build-converge` selects this one via
# HARNESS_WORKER_SECRET_BUILD_CONVERGE=harness-worker-build-converge on the dispatcher.
#
# The split is worth a file each because the worker is the least-trusted component in the fleet: it
# runs a model that writes code into a working tree and then executes that repository's own
# verify.sh. A build-codex worker must never hold the LiteLLM key it would never use.
#
# NOTHING here can launch compute. The dispatch API token — the one identity that can create Jobs —
# lives with the coordinator and is deliberately absent: a worker that can start more workers turns
# one compromise into a fleet.
#
# REUSED, not minted: harness-coordinator/token is already materialised by
# clusters/pi-k3s/harness/external-secret.yaml and its header argues the general case — it is the
# shared bearer token workers present when reporting, which is exactly what this is.
#
# MINTED, and why (docs/secrets-map.md was walked first): the clone token and the outcome PAT are
# two GitHub identities rather than one, because one PAT doing both means a worker that only ever
# needed to read is holding the credential that can write. Neither may be mtgibbs-github/token —
# that is the broad automation identity, and this is the component whose credentials should be the
# narrowest in the fleet. litellm-key is a per-consumer virtual key, which the map lists as a
# genuinely per-workload mint (cost attribution, independent revocation, model scoping).
#
# HARNESS_CLONE_TOKEN's NAME is provisional: run-task.sh clones a plain https URL with no token in
# it and relies on a credential helper written at container start, but no entrypoint writing
# ~/.git-credentials exists in mtgibbs/harness yet. See README.md — the name is one of the things
# that lands with the dispatcher image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-worker-build-converge
  namespace: harness-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harness-worker-build-converge
    creationPolicy: Owner
    template:
      data:
        # Not a secret, but it travels with them: the worker gets its whole environment from one
        # envFrom, and the coordinator is reached in-cluster rather than back out through ingress.
        HARNESS_REPORT_URL: "http://harness-coordinator.harness.svc.cluster.local:8877"
        HARNESS_REPORT_TOKEN: "{{ .report_token }}"
        HARNESS_LITELLM_KEY: "{{ .litellm_key }}"
        HARNESS_CLONE_TOKEN: "{{ .clone_token }}"
        HARNESS_OUTCOME_PAT: "{{ .outcome_pat }}"
  data:
    - secretKey: report_token
      remoteRef:
        key: harness-coordinator/token
    - secretKey: litellm_key
      remoteRef:
        key: harness-fleet/litellm-key
    - secretKey: clone_token
      remoteRef:
        key: harness-fleet/clone-token
    - secretKey: outcome_pat
      remoteRef:
        key: harness-fleet/outcome-pat
