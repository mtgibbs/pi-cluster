# THE load-bearing resource in this directory. Read this before changing anything here.
#
# The Job that mtgibbs/harness renders for a run carries no `imagePullSecrets` and no
# `serviceAccountName`, and that is a decision rather than an omission — the dispatcher staying
# describable in a paragraph is a named cliff in that repo's docs/design/fleet-dispatch.md. So the
# Job body will never name a pull credential, and a pod that names no ServiceAccount runs as
# `default`. A pull secret attached to `default` applies to every pod in the namespace without any
# pod asking for it, which is exactly what lets the rendered body stay as small as it is.
#
# Declaring a ServiceAccount literally named `default` is how that is expressed in GitOps:
# Kubernetes auto-creates the account with the namespace, and this manifest merges into it.
#
# Get this wrong and every dispatched run dies at ImagePullBackOff with nothing in the Job to
# explain why — the failure names the image, never the missing account patch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: harness-fleet
imagePullSecrets:
  - name: ghcr-pull-secret
