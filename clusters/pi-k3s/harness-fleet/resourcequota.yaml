# The cap on a runaway dispatcher.
#
# The concurrent-Job cap below is 2 because that is the number fleet-dispatch.md names — two runs
# at once on one Pi, with the model work happening on the Beelink either way. The number is written
# down with its reason because a bare "2" reads as arbitrary, and whoever raises it should know
# what it was protecting: the rendered Job sets backoffLimit 0 so a Job does not retry, but nothing
# in the dispatcher stops it creating a hundred of them, and a hundred pending pods is an outage of
# everything else scheduled on that node.
#
# The compute limits are sized to exactly two workers at the LimitRange's defaults (limitrange.yaml)
# PLUS the dispatcher's own pod — 2 x (2 CPU, 2Gi) workers + (250m, 256Mi) dispatcher
# (deployment.yaml). They are a second, independent ceiling: raising the Job count alone will
# start hitting these, which is the intended order of discovery.
#
# The dispatcher term exists because a quota counts EVERY pod in the namespace, its own launcher
# included. At exactly 2 x worker defaults, the dispatcher's 250m of limit headroom would have made
# the SECOND worker unschedulable — admission names the quota, not the pod that quietly ate the
# margin, so the arithmetic is written down here instead of rediscovered from that error.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: harness-fleet
  namespace: harness-fleet
spec:
  hard:
    count/jobs.batch: "2"
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "4250m"
    limits.memory: 4352Mi
