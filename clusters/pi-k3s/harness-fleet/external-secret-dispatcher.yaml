# The dispatch API token — the one identity that can create Jobs — as its own secret.
#
# NOT a reuse of harness-coordinator/token, deliberately, and the reason is the same one that keeps
# HARNESS_API_TOKEN out of every worker secret (AC-9): every worker HOLDS the coordinator token —
# it is the bearer they present when reporting — so reusing it here would mean a token that leaks
# from any worker can also launch compute, which is exactly the escalation the three-identity table
# in the harness's docs/executors.md exists to prevent. The dispatch token is held by nothing but
# this namespace's dispatcher Deployment and whoever calls its API.
#
# MINTED (docs/secrets-map.md walked first): no existing item is this identity. The field is
# `dispatch-api-token` on the existing `harness-fleet` 1Password item, alongside clone-token /
# outcome-pat / litellm-key — one item for the fleet's identities, one field per identity. Any
# long-random value works; api.py compares it verbatim as `Bearer <token>`. Minting needs `op` on
# the laptop; until the field exists ESO reports SecretSyncErr and the Flux Kustomization
# (wait: true) holds not-ready.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-dispatcher
  namespace: harness-fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harness-dispatcher
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: harness-fleet/dispatch-api-token
