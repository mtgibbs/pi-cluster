# `kubectl exec ... -- nh list/stats/fetch-jd/score` work in-cluster; scoring/distill call the
# Beelink LiteLLM. App repo: mtgibbs/new-horizons. PREREQS before green: the new-horizons/litellm-key
# 1Password item + the ghcr.io/mtgibbs/new-horizons:0.1.0 image, which stays PRIVATE (it bakes in
# profile/ = résumé PII) and is pulled with the shared ghcr-pull-secret. See docs/new-horizons-deploy.md.
# NOTE the `wait: true` below: this Kustomization reports FAILED until both prereqs exist, so land
# them before merging rather than after.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: new-horizons
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
