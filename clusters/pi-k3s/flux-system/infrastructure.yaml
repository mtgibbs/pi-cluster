# 35. model-watch - monthly "what should we be running?" digest. Sweeps the HuggingFace
# API for newly-trending text-generation models, computes the intake gates from
# docs/model-onboarding.md against real metadata (params, MoE config, licence), has the
# Beelink summarise only what clears them, and pushes to the ntfy `model-watch` topic.
# Facts are computed, prose is generated — so the digest cannot invent a model.
# The model-watch/litellm-key 1Password item (a LiteLLM virtual key scoped to
# `hot-reasoner`) was minted 2026-08-29, so the `wait: true` prereq is satisfied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: model-watch
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
  interval: 10m
  path: ./clusters/pi-k3s/model-watch
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 36. harness-fleet - the namespace a dispatched fleet worker lands in. Deliberately empty of
# workloads: it holds only what the harness's rendered Job does *not* carry — a `default`
# ServiceAccount with the GHCR pull secret attached (the Job names no imagePullSecrets), a
# LimitRange supplying the requests the ResourceQuota demands (the Job names no resources), the
# quota itself, RBAC for a dispatcher that has no image yet, and the two per-strategy worker
# secrets. Registering it creates a namespace nothing runs in — that is the expected state, and
# `clusters/pi-k3s/harness-fleet/README.md` says what unblocks each half. The four
# `harness-fleet/*` 1Password fields were minted 2026-08-30, so `wait: true` has what it needs:
# from here it reports FAILED if an ExternalSecret stops resolving, which is the point.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harness-fleet
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
  interval: 10m
  path: ./clusters/pi-k3s/harness-fleet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 37. agents - the agent sandbox: the agent-runner Deployment plus the short-lived, locked-down
# Jobs it launches for n8n (clusters/pi-k3s/agents/README.md, docs/design/agent-sandbox.md).
# Registered 2026-11-11, once its 1Password fields existed: pi-cluster/agent-runner/api-token and
# homelab-agent/agent-media-investigator/litellm-key (plus the reused mcp-homelab-readonly/password).
# `wait: true` turns this red if an ExternalSecret stops resolving or the runner is not Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
  interval: 10m
  path: ./clusters/pi-k3s/agents
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 38. kelos - the Kelos controller + web console (kelos.lab.mtgibbs.dev): a Kubernetes-native
# controller that runs coding-agent tasks as custom resources (clusters/pi-k3s/kelos/README.md).
# Flux Helm (chart oci://ghcr.io/kelos-dev/charts/kelos 0.64.0) into `kelos-system`, with the
# chart's CRDs (`crds.install: true`). Needs cert-manager: the CRDs carry a conversion webhook whose
# serving cert cert-manager issues. `wait: true` holds this Kustomization un-Ready until the
# HelmRelease is Ready — i.e. until the CRDs exist and the controller is serving — which is what
# `kelos-workspace` below depends on. The `kelos/console-token` 1Password field is already minted.
# Timeout is 15m because the HelmRelease's own install timeout is 10m (first image pulls on a Pi).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kelos
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
    - name: ingress
    - name: cert-manager-config
  interval: 10m
  path: ./clusters/pi-k3s/kelos/controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 15m
---
# 39. kelos-workspace - the `kelos-tasks` namespace Kelos agent pods run in: ResourceQuota +
# LimitRange sized for ONE agent pod, the two credentials REUSED from the harness fleet
# (`harness-fleet/outcome-pat`, `harness-fleet/litellm-key`), and the `factory-trial` Workspace.
# CRD-then-CR ordering, same shape as cert-manager -> cert-manager-config and tailscale ->
# tailscale-config: `Workspace` is a kelos.dev kind, so this dependsOn `kelos`.
# `wait: true` is load-bearing for the NEXT Kustomization — it keeps this one un-Ready until both
# ExternalSecrets have synced, so `kelos-tasks` never applies a Task before its Secrets exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kelos-workspace
  namespace: flux-system
spec:
  dependsOn:
    - name: kelos
    - name: external-secrets-config
  interval: 10m
  path: ./clusters/pi-k3s/kelos/workspace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 40. kelos-tasks - the Kelos Tasks themselves; submitting one is adding a manifest under
# clusters/pi-k3s/kelos/tasks via PR. Split from `kelos-workspace` on purpose: Kelos marks a Task
# permanently Failed if its Workspace's Secret is missing when the Task is first reconciled (no
# requeue), so Tasks must not apply in the same batch as the ExternalSecrets that produce it.
# Today it holds one smoke Task (`smoke-word-stats`), which runs ONCE on merge — on qwen
# (`hot-coder`) on pi5-worker-2 — and opens a PR in mtgibbs/factory-trial.
# NOTE prune: removing a Task's file deletes the Task, its Job and its run record. Tasks carry a
# finalizer the controller must clear, so remove Tasks BEFORE ever removing `kelos` itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kelos-tasks
  namespace: flux-system
spec:
  dependsOn:
    - name: kelos-workspace
  interval: 10m
  path: ./clusters/pi-k3s/kelos/tasks
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 41. fabro-secrets - stage 1 of Fabro (clusters/pi-k3s/fabro/README.md): the `fabro` namespace and
# its two ExternalSecrets — `fabro-server-env` (SESSION_SECRET + the dev login token, minted as
# 1Password item `fabro`) and `fabro-vault-seed` (LITELLM_API_KEY + GITHUB_TOKEN, REUSED from
# `harness-fleet/litellm-key` and `harness-fleet/outcome-pat`).
# `wait: true` is load-bearing for the NEXT Kustomization: it keeps this one un-Ready until both
# ExternalSecrets have synced, so `fabro` never creates the pod before the Secrets it mounts exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabro-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
  interval: 10m
  path: ./clusters/pi-k3s/fabro/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
---
# 42. fabro - stage 2: the Fabro workflow engine (fabro.lab.mtgibbs.dev) — API server + web UI
# that runs coding-agent workflows inside Docker sandboxes. One StatefulSet pod on pi5-worker-2
# (`harness-fleet=true`): the Fabro server, an UNPRIVILEGED rootless Docker sidecar the sandboxes
# run in, and a bootstrap container that provisions Fabro's vault and environments on every start;
# plus Service, Ingress and a NetworkPolicy that bounds the sandboxes.
# Two stages, not kelos' three, and for a weaker reason than kelos had: nothing here fails
# permanently if a Secret is late (the kubelet just holds the pod in CreateContainerConfigError and
# retries). The split buys attribution — a 1Password/ESO failure shows up as `fabro-secrets` not
# Ready, rather than as this Kustomization burning its timeout on a pod that cannot start.
# `wait: true` + the bootstrap container's readinessProbe mean Ready here = server up AND
# configured. Timeout is 10m for first image pulls on a Pi (three images).
# The pod shape was proven on a k3d test cluster, NOT on the Pi nodes: if the pod does not come up,
# read "Review this first" in the README before anything else — it has the fallback.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fabro
  namespace: flux-system
spec:
  dependsOn:
    - name: fabro-secrets
    - name: ingress
    - name: cert-manager-config
  interval: 10m
  path: ./clusters/pi-k3s/fabro/server
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
