apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-homelab-secrets
  namespace: mcp-homelab
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-homelab-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: mcp-homelab/api-key
    - secretKey: nas-private-key
      remoteRef:
        key: mcp-homelab/nas-private-key
    - secretKey: jellyfin-api-key
      remoteRef:
        key: mcp-homelab/jellyfin-api-key
    # Pi-hole v6 authenticates with the WEB PASSWORD (POST /api/auth -> sid), so despite the
    # name this is not an API token: it must equal `pihole/password`, which each Pi-hole pod
    # re-asserts via `pihole setpassword` in its postStart hook. Point at that item directly —
    # a forked copy in `mcp-homelab/pihole-api-token` silently drifted and 401'd (2026-08-02).
    # secretKey stays `pihole-api-token` so the Deployment's PIHOLE_API_TOKEN env is untouched.
    - secretKey: pihole-api-token
      remoteRef:
        key: pihole/password
    - secretKey: immich-api-key
      remoteRef:
        key: mcp-homelab/immich-api-key
    - secretKey: bazarr-api-key
      remoteRef:
        key: mcp-homelab/bazarr-api-key
    - secretKey: sonarr-api-key
      remoteRef:
        key: mcp-homelab/sonarr-api-key
    - secretKey: radarr-api-key
      remoteRef:
        key: mcp-homelab/radarr-api-key
    - secretKey: sabnzbd-api-key
      remoteRef:
        key: mcp-homelab/sabnzbd-api-key
    - secretKey: mealie-api-token
      remoteRef:
        key: mcp-homelab/mealie-api-token
