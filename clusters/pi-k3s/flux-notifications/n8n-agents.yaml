# Flux → n8n: "Flux has a new revision of the repo" → the sec-researcher workflow
# (clusters/pi-k3s/n8n/workflows/agent-sec-researcher.json, docs/agent-sandbox-n8n.md "sec-researcher").
#
# Event-driven, not polling: source-controller emits ONE `NewArtifact` event when the GitRepository
# `flux-system` stores an artifact for a new commit ("stored artifact for commit '…'", metadata.revision
# "main@sha1:<sha>"); notification-controller forwards it here. n8n still dedupes on the commit sha (atomic
# claim in its `agent_dedupe` table) as defence in depth and, once per revision, asks GitHub's public compare
# API which files changed. Only a revision that touched access-control paths starts a run. The artifact the
# agent's checkout downloads exists the moment this event fires.
#
# Why not Kustomization events (the first version): kustomize-controller emits `ReconciliationSucceeded` on
# EVERY reconcile, changed or not — 42 Kustomizations × every 10 min ≈ 250 POSTs/hour, each one an n8n
# execution that the dedupe then dropped (2026-11-12/13: 707 executions in under 3 h, zero runs).
#
# Auth (fails closed): notification-controller sends `Authorization: Bearer <token>` from the Secret
# below; n8n's Webhook node checks it with its Header Auth credential and answers 403 without it. No
# Secret → the Provider is not Ready → no events are sent at all.
#
# Credential: REUSED, not minted. 1Password `pi-cluster/n8n-agent-alert-webhook` field `token` is
# the "in-cluster sender → n8n agent webhook" identity Alertmanager already uses (monitoring/
# external-secret.yaml). Same role, same receiver (n8n's agent webhooks, behind the same n8n
# credential `agent-alert-token`), same blast radius: whoever holds it can start READ-ONLY agent runs,
# bounded by dedupe and each manifest's runs_per_day. It is NOT n8n/webhook-token, which sits at the
# public edge (Cloudflare Email Worker).
#
# Address: the n8n webhook tier's in-cluster Service. flux-system's `allow-egress` policy permits all
# egress from notification-controller; n8n has no NetworkPolicy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-agent-flux-webhook
  namespace: flux-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: n8n-agent-flux-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Provider type `generic` reads extra request headers from the `headers` key (YAML map).
        headers: |
          Authorization: Bearer {{ .token }}
  data:
    - secretKey: token
      remoteRef:
        key: n8n-agent-alert-webhook/token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: n8n-agents
  namespace: flux-system
spec:
  type: generic
  address: http://n8n-webhook.n8n.svc.cluster.local:5678/webhook/agent-sec-revision
  timeout: 15s
  secretRef:
    name: n8n-agent-flux-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: sec-researcher-revisions
  namespace: flux-system
spec:
  providerRef:
    name: n8n-agents
  # source-controller only emits an info event for a GitRepository on a NEW artifact (`NewArtifact`) or on
  # recovery from a failure (`Succeeded`, same revision — n8n's dedupe absorbs it); a no-op reconcile emits
  # nothing (source-controller v1.7 gitrepository_controller.go notify()). `eventSeverity: info` also passes
  # error events (fetch failures, which repeat every interval while GitHub is unreachable): the inclusion
  # list keeps only the "stored artifact" message, so those never reach n8n.
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: flux-system
      namespace: flux-system
  inclusionList:
    - "^stored artifact for commit"
