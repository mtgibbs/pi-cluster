# The intake's two credentials, read from its process environment (envFrom):
#
#   FABRO_DEV_TOKEN       REUSED from 1Password `fabro/dev-token` — Fabro has one login, and the
#                         intake is the only automated holder of it (the design's "sole holder").
#                         Rotating it means restarting this pod as well as the Fabro server.
#   FACTORY_INTAKE_TOKEN  MINTED (1Password item `factory-intake`, field `token`): the bearer n8n
#                         sends on POST /requests, and that the intake sends back on its result
#                         webhook. One shared secret for both directions (design §3). No existing
#                         credential plays this role — n8n's other callers each have their own.
#                         The service refuses to start if it is shorter than 32 characters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-intake-env
  namespace: fabro
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: factory-intake-env
    creationPolicy: Owner
  data:
    - secretKey: FABRO_DEV_TOKEN
      remoteRef:
        key: fabro/dev-token
    - secretKey: FACTORY_INTAKE_TOKEN
      remoteRef:
        key: factory-intake/token
