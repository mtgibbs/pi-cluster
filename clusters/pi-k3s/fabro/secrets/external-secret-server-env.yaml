# The Fabro server's two bootstrap secrets, read from its process environment (envFrom):
#
#   SESSION_SECRET   encrypts web-UI session cookies (64 hex characters).
#   FABRO_DEV_TOKEN  the ONE shared login: the web UI's login page accepts it, and the CLI and REST
#                    API send it as `Authorization: Bearer fabro_dev_…`. Form `fabro_dev_` + 64 hex
#                    characters — a pre-set value of that form was confirmed accepted on the test
#                    cluster (the server does not insist on minting its own).
#
# MINTED, and why (docs/secrets-map.md was walked first): both are Fabro's own identity — its
# cookie key and its own login — with no existing credential playing that role. The 1Password item
# `fabro` (fields `session-secret`, `dev-token`) already exists in the `pi-cluster` vault.
#
# The bootstrap container reads FABRO_DEV_TOKEN from this same Secret to configure the server
# (../server/bootstrap.sh). Rotating either field needs a pod restart: both are env vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fabro-server-env
  namespace: fabro
spec:
  # 24h, like the rest of the cluster's static tokens — see
  # harness-fleet/external-secret-worker-build-converge.yaml for the 2026-09-01 rate-limit story.
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: fabro-server-env
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: fabro/session-secret
    - secretKey: FABRO_DEV_TOKEN
      remoteRef:
        key: fabro/dev-token
