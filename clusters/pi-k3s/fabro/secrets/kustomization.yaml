apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Stage 1 of 2 (Flux Kustomization `fabro-secrets`): the namespace and the two ExternalSecrets.
# With `wait: true` this stage is Ready only once both have synced, and the workload stage
# (../server, Flux Kustomization `fabro`) dependsOn it — so the pod is never created before the
# Secrets it mounts exist. Why that is worth a stage is argued in ../README.md.
#
# No top-level `namespace:`; every file declares `namespace: fabro`.
resources:
  - namespace.yaml
  - external-secret-server-env.yaml
  - external-secret-vault-seed.yaml
