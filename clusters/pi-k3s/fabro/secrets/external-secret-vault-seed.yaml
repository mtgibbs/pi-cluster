# What the bootstrap container writes into Fabro's own vault on every pod start.
#
# Fabro does not read provider keys or the GitHub token from its environment: it keeps them in a
# vault inside its SQLite database and only accepts them through its CLI/API against a running
# server. So this Secret is not consumed by the server at all. It is mounted as files into the
# `bootstrap` container, which runs `fabro secret set <KEY>` once per key (../server/bootstrap.sh).
# EVERY key in this Secret becomes a vault secret of the same name — adding a key here is how a new
# vault secret is provisioned; nothing is set by hand in the UI.
#
# One REUSED, one Fabro's own (docs/secrets-map.md was walked first):
#
#   LITELLM_API_KEY <- fabro/litellm-key           Fabro's OWN LiteLLM virtual key (alias `fabro`,
#                                                  minted 2026-11-25). Allowed models: `hot-coder`,
#                                                  `claude-haiku`, `claude-sonnet`. Budget: $100
#                                                  per 30 days, which only the Claude aliases can
#                                                  spend — `hot-coder` has no price in LiteLLM and
#                                                  bills $0 (checked live). Per-workload on
#                                                  purpose: the shared fleet key is local-only, and
#                                                  a hosted-model budget has to be attributable to
#                                                  the one workload that spends it. Fabro's
#                                                  `litellm` provider looks the key up under
#                                                  exactly this name.
#   GITHUB_TOKEN    <- harness-fleet/outcome-pat   REUSED: the fleet's outcome PAT (Contents, Pull
#                                                  requests and Workflows: read-write, all of the
#                                                  account's repos). Fabro's `token` GitHub
#                                                  strategy looks it up under exactly this name.
#                                                  Shared with the harness fleet and Kelos, so
#                                                  revoking it stops all three.
#
# The blast radius is the PAT's, not this namespace's: with the `token` strategy Fabro hands the
# PAT itself to the agent sandbox, and Fabro stores it — and the LiteLLM key — in PLAINTEXT in the
# database on the `storage-fabro-0` PVC, which is also copied to the QNAP by worker2-backup. See
# ../README.md.
#
# Rotation: a new value reaches the mounted files within the refresh interval, but the bootstrap
# only runs at pod start — delete the pod to push it into the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fabro-vault-seed
  namespace: fabro
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: fabro-vault-seed
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: fabro/litellm-key
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: harness-fleet/outcome-pat
