# What the bootstrap container writes into Fabro's own vault on every pod start.
#
# Fabro does not read provider keys or the GitHub token from its environment: it keeps them in a
# vault inside its SQLite database and only accepts them through its CLI/API against a running
# server. So this Secret is not consumed by the server at all. It is mounted as files into the
# `bootstrap` container, which runs `fabro secret set <KEY>` once per key (../server/bootstrap.sh).
# EVERY key in this Secret becomes a vault secret of the same name — adding a key here is how a new
# vault secret is provisioned; nothing is set by hand in the UI.
#
# REUSED, not minted (docs/secrets-map.md was walked first). Credentials scale by role, not by
# tool, and Fabro is a third runner in the role the harness fleet workers and the Kelos agent pods
# already play — clone, push a branch, open a PR, spend `hot-coder` tokens, on the same node:
#
#   LITELLM_API_KEY <- harness-fleet/litellm-key   the fleet's LiteLLM virtual key; verified to
#                                                  allow `hot-coder`. Fabro's `litellm` provider
#                                                  looks the key up under exactly this name.
#   GITHUB_TOKEN    <- harness-fleet/outcome-pat   the fleet's outcome PAT (Contents, Pull requests
#                                                  and Workflows: read-write, all of the account's
#                                                  repos). Fabro's `token` GitHub strategy looks it
#                                                  up under exactly this name.
#
# The cost of sharing is the same as it was for Kelos, now three ways: LiteLLM cannot attribute
# spend between the fleet, Kelos and Fabro, and revoking either credential stops all three. Other
# consumers: harness-fleet/external-secret-worker-build-converge.yaml,
# kelos/workspace/external-secret-{github-token,litellm-key}.yaml.
#
# The blast radius is the PAT's, not this namespace's: with the `token` strategy Fabro hands the
# PAT itself to the agent sandbox, and Fabro stores it — and the LiteLLM key — in PLAINTEXT in the
# database on the `storage-fabro-0` PVC, which is also copied to the QNAP by worker2-backup. See
# ../README.md.
#
# Rotation: a new value reaches the mounted files within the refresh interval, but the bootstrap
# only runs at pod start — delete the pod to push it into the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fabro-vault-seed
  namespace: fabro
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: fabro-vault-seed
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: harness-fleet/litellm-key
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: harness-fleet/outcome-pat
