# Fabro's namespace: the server, its rootless Docker sidecar, and the two Secrets they read.
#
# No `pod-security.kubernetes.io/enforce` label. The prototype carried `enforce: privileged`; the
# same pod was deployed into an unlabelled namespace on the test cluster and was admitted and ran.
# This cluster sets no Pod Security admission defaults, so an unlabelled namespace is unenforced —
# the label was documentation, not a permission. If a cluster-wide Pod Security default is ever
# introduced, this namespace needs `privileged`: the sidecar's `procMount: Unmasked`,
# `allowPrivilegeEscalation: true`, added SETUID/SETGID, Unconfined seccomp and hostPath volume are
# all outside `baseline`. See ../README.md.
#
# Lives in the `fabro-secrets` stage because it must exist before the ExternalSecrets that
# materialise into it; the workload stage (../server) depends on this one.
apiVersion: v1
kind: Namespace
metadata:
  name: fabro
