apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: pi-cluster
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
---
# Tier 1 (read-only, agent-safe) creds live in their own vault, `homelab-agent`, so a laptop
# service account can read them without Touch ID. 1Password service-account vault grants are
# fixed at creation, so this store has its OWN bootstrap token (an SA scoped read-only to
# `homelab-agent`), created manually like `onepassword-service-account` — see
# docs/secrets-map.md "Vaults". Tier 2/3 creds never go in this vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-homelab-agent
spec:
  provider:
    onepasswordSDK:
      vault: homelab-agent
      auth:
        serviceAccountSecretRef:
          name: onepassword-homelab-agent-service-account
          namespace: external-secrets
          key: token
