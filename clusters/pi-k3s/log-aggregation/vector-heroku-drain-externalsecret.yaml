apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vector-heroku-drain
  namespace: log-aggregation
spec:
  # Basic-auth password for the public Heroku log drain (logs.mtgibbs.dev → Vector).
  # Per-workload credential: only Vector checks it and only the Heroku drain URL
  # carries it. Rotating = update the 1Password field, then re-add the Heroku drain
  # with the new URL and remove the old one.
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: vector-heroku-drain
    creationPolicy: Owner
  data:
    - secretKey: PASSWORD
      remoteRef:
        key: log-drain/heroku-password
