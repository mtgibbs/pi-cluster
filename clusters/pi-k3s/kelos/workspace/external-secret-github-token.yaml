# The GitHub token a Kelos agent pod uses to clone, push a branch and open a PR.
#
# REUSED, not minted (docs/secrets-map.md was walked first): `harness-fleet/outcome-pat` is the
# fleet workers' outcome identity — clone, push a branch, open a PR — and that is exactly the role
# a Kelos agent pod plays. Credentials scale by role, not by tool: a second runner doing the same
# job gets the same identity, so there is one token to rotate and one blast radius to reason about.
# The other consumer is harness-fleet/external-secret-worker-build-converge.yaml.
#
# The blast radius is the PAT's, not this namespace's: it is handed to a pod running a model with
# an unrestricted shell. See ../README.md.
#
# Kelos reads the key name GITHUB_TOKEN specifically (Workspace.spec.secretRef): it mounts the
# Secret as a file for git's credential helper and exports it as GITHUB_TOKEN / GH_TOKEN for `gh`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: kelos-tasks
spec:
  # 24h, matching the cluster's other static tokens (see the 2026-09-01 rate-limit note in
  # harness-fleet/external-secret-worker-build-converge.yaml).
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-token
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: harness-fleet/outcome-pat
