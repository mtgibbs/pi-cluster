# The LiteLLM virtual key a Kelos agent pod presents to the Beelink (https://ai.lab.mtgibbs.dev/v1).
#
# REUSED, not minted (docs/secrets-map.md was walked first): `harness-fleet/litellm-key` is the
# fleet workers' model key and is verified to allow the `hot-coder` model the smoke Task uses. A
# Kelos agent pod is the same role — an unattended coding worker on the same node spending the same
# model budget — so it shares the key. The cost of sharing is that LiteLLM cannot attribute spend
# between the fleet and Kelos, and revoking one revokes both; if Kelos outlives its trial, that is
# the argument for minting it its own key.
#
# Not wired by Kelos itself: a Task injects it with podOverrides.env (LITELLM_KEY), and the
# Workspace's setupCommand writes an OpenCode provider config that reads `{env:LITELLM_KEY}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-key
  namespace: kelos-tasks
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-key
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_KEY
      remoteRef:
        key: harness-fleet/litellm-key
