# The Kelos console's login token (consoleServer.auth.mode: staticToken).
#
# MINTED, and why (docs/secrets-map.md was walked first): this is the console's own login
# credential — a genuinely per-workload secret with no existing identity to reuse. The 1Password
# item `kelos` (field `console-token`) already exists in the `pi-cluster` vault.
#
# The chart mounts Secret `kelos-console-token`, key `token`, as a file; the console pod sits in
# ContainerCreating until this ExternalSecret has synced, which is why it is listed before the
# HelmRelease in kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kelos-console-token
  namespace: kelos-system
spec:
  # 24h, like the rest of the cluster's static tokens — see
  # harness-fleet/external-secret-worker-build-converge.yaml for the 2026-09-01 rate-limit story.
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kelos-console-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kelos/console-token
