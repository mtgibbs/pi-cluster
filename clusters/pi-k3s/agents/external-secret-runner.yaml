# The runner API token — the bearer n8n presents on POST /runs (CONTRACT §3).
#
# MINTED, not reused (docs/secrets-map.md walked first). This is the one identity that can create
# compute in this namespace, so it is NOT harness-fleet/dispatch-api-token (a different launcher in
# a different blast radius) and NOT harness-coordinator/token (held by every harness worker). Same
# reasoning as harness-fleet/external-secret-dispatcher.yaml.
#
# Store: `onepassword` (vault pi-cluster), NOT homelab-agent. It is Tier 2 (cluster-acting — it
# launches Jobs), and the secrets-map rule is that Tier 2 never goes in the vault readable without a
# human in the loop.
#
# 1Password: item `agent-runner`, field `api-token`, any long random value; the runner compares it
# verbatim as `Bearer <token>`. n8n will need the same value in its own credential store when the
# workflow that calls the runner is built. Until the field exists ESO reports SecretSyncErr — which
# is why this directory is not registered with Flux yet (README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-runner
  namespace: agents
spec:
  # 24h like the rest of the cluster: a static token gains nothing from fast polling, and the 1h
  # pollers are what kept the 1Password store rate-limited on 2026-09-01.
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agent-runner
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: agent-runner/api-token
