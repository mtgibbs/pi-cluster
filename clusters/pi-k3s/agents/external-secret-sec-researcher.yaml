# Everything a sec-researcher Job is given, as ONE Secret — the manifest's `secret:` (CONTRACT §2),
# envFrom'd into the agent container only (the checkout init container gets no envFrom: it needs no
# credential). The runner never reads it (rbac.yaml grants no secrets verb).
#
# The data keys ARE the environment variable names inside the Job:
#   AGENT_LITELLM_KEY         — read by the agent runtime (CONTRACT §6)
#   MCP_HOMELAB_READONLY_KEY  — the manifest's connectors.mcp[homelab].key_env
#
# NOT here, on purpose: any GitHub credential. The agent returns structured `plan` items and n8n files
# them with its own `github-plans` credential (docs/agent-sandbox-n8n.md, "sec-researcher").
#
# Store: `onepassword-homelab-agent` (vault homelab-agent), same as the other agents: Tier 1.
#
# REUSED: mcp-homelab-readonly/password — the read-only homelab-MCP key (server-scoped to
# `readOnly: true` tools). Do NOT swap in mcp-homelab/api-key (the full, Tier 2 key).
#
# MINTED: agent-sec-researcher/litellm-key — a per-agent LiteLLM virtual key, alias
# `agent-sec-researcher`, models = [claude-haiku, claude-sonnet] (Sonnet only for the weekly sweep;
# never Opus), max_budget 3, budget_duration 1d (README.md activation checklist).
#
# 1Password: create item `agent-sec-researcher` in the **homelab-agent** vault with field
# `litellm-key`. Until it exists ESO reports SecretSyncErr — and with `wait: true` on the `agents`
# Kustomization, the whole Kustomization goes not-Ready. Create it BEFORE merging.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-sec-researcher
  namespace: agents
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab-agent
  target:
    name: agent-sec-researcher
    creationPolicy: Owner
  data:
    - secretKey: AGENT_LITELLM_KEY
      remoteRef:
        key: agent-sec-researcher/litellm-key
    - secretKey: MCP_HOMELAB_READONLY_KEY
      remoteRef:
        key: mcp-homelab-readonly/password
