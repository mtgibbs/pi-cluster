# Two identities, and the gap between them is the point.
#
# agent-run — what every agent Job runs as (CONTRACT §4 `serviceAccountName: agent-run`). It has NO
# Role, NO RoleBinding and no token: `automountServiceAccountToken: false` here AND on the rendered
# pod, so even a future binding someone adds by mistake gives a compromised agent nothing to present
# to the API server. An agent's only reach into the cluster is the MCP connector its manifest
# allowlists, through a read-only key the MCP server enforces (see manifests/media-investigator.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-run
  namespace: agents
automountServiceAccountToken: false
---
# agent-runner — the runner Deployment's identity, the ONE thing here that can create compute.
# Bounded by rbac.yaml to Jobs (and reading pods/logs) in this namespace only. It keeps its token
# mounted because talking to the API server is its whole job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  namespace: agents
automountServiceAccountToken: true
---
# The namespace's auto-created `default` account, merged into so it carries no token either. Nothing
# here should run as `default` — the runner names agent-runner and every Job names agent-run — so
# this only matters for a pod that forgot to name one, and then it should get nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: agents
automountServiceAccountToken: false
