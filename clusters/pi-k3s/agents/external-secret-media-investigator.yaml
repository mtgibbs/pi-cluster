# Everything a media-investigator Job is given, as ONE Secret — the manifest's `secret:`
# (CONTRACT §2), envFrom'd into the Job by the kubelet. The runner never reads it (rbac.yaml grants
# no secrets verb). One Secret PER AGENT, so an agent never holds a key another agent needed.
#
# The data keys ARE the environment variable names inside the Job:
#   AGENT_LITELLM_KEY         — read by the agent runtime (CONTRACT §6)
#   MCP_HOMELAB_READONLY_KEY  — the manifest's connectors.mcp[homelab].key_env
#
# Store: `onepassword-homelab-agent` (vault homelab-agent). Both values are Tier 1 — read-only,
# agent-safe — which is exactly what that vault is for (docs/secrets-map.md, Vaults), and the
# precedent is local-llm-mcp/external-secret.yaml, which keeps its LiteLLM key there too. Both items
# live in the same vault, so one store covers both.
#
# REUSED: mcp-homelab-readonly/password — the existing read-only homelab-MCP key, already
# materialised in ns mcp-homelab as Secret mcp-homelab-readonly and loaded by the server as
# MCP_READONLY_API_KEY. The server scopes that key to `readOnly: true` tools, at both tools/list and
# tools/call (pi-cluster-mcp src/tools/index.ts). Do NOT swap in mcp-homelab/api-key: that is the
# full key (restart, exec-on-node, trigger_backup) and is Tier 2.
#
# MINTED: agent-media-investigator/litellm-key — a per-agent LiteLLM virtual key, per-workload by
# design (secrets-map: cost attribution, independent revocation, model scoping). Mint it with
# models = [hot-coder, claude-haiku] (the manifest's model.allow) and a daily max_budget; the key's
# allowlist is the real model boundary, the manifest's list is only the order to try them in.
#
# 1Password: create item `agent-media-investigator` in the **homelab-agent** vault with field
# `litellm-key`. Until it exists ESO reports SecretSyncErr (README.md activation checklist).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-media-investigator
  namespace: agents
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab-agent
  target:
    name: agent-media-investigator
    creationPolicy: Owner
  data:
    - secretKey: AGENT_LITELLM_KEY
      remoteRef:
        key: agent-media-investigator/litellm-key
    - secretKey: MCP_HOMELAB_READONLY_KEY
      remoteRef:
        key: mcp-homelab-readonly/password
