# Everything an ops-investigator Job is given, as ONE Secret — the manifest's `secret:`
# (CONTRACT §2), envFrom'd into the Job by the kubelet. The runner never reads it (rbac.yaml grants
# no secrets verb). One Secret PER AGENT, so an agent never holds a key another agent needed.
#
# The data keys ARE the environment variable names inside the Job:
#   AGENT_LITELLM_KEY         — read by the agent runtime (CONTRACT §6)
#   MCP_HOMELAB_READONLY_KEY  — the manifest's connectors.mcp[homelab].key_env
#
# Store: `onepassword-homelab-agent` (vault homelab-agent), same as media-investigator: both values
# are Tier 1 — read-only, agent-safe.
#
# REUSED: mcp-homelab-readonly/password — the existing read-only homelab-MCP key (server scopes it
# to `readOnly: true` tools at tools/list AND tools/call). Do NOT swap in mcp-homelab/api-key: that
# is the full, Tier 2 key.
#
# MINTED: agent-ops-investigator/litellm-key — a per-agent LiteLLM virtual key (cost attribution,
# independent revocation, model scoping). Mint with models = [hot-coder, claude-haiku],
# max_budget 3, budget_duration 1d (README.md activation checklist).
#
# 1Password: create item `agent-ops-investigator` in the **homelab-agent** vault with field
# `litellm-key`. Until it exists ESO reports SecretSyncErr — and with `wait: true` on the `agents`
# Kustomization, the whole Kustomization goes not-Ready. Create it BEFORE merging.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-ops-investigator
  namespace: agents
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-homelab-agent
  target:
    name: agent-ops-investigator
    creationPolicy: Owner
  data:
    - secretKey: AGENT_LITELLM_KEY
      remoteRef:
        key: agent-ops-investigator/litellm-key
    - secretKey: MCP_HOMELAB_READONLY_KEY
      remoteRef:
        key: mcp-homelab-readonly/password
