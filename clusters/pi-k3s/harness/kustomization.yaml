apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` here, deliberately. Kustomize's namespace transformer rewrites
# EVERY namespaced resource, which would drag image-automation.yaml's ImageRepository,
# ImagePolicy and ImageUpdateAutomation out of flux-system and into harness — where their
# ghcr-credentials secret and the flux-system GitRepository do not exist. Every other file
# in this directory already declares `namespace: harness` on its own, and every other
# service that ships image-automation.yaml omits this field for the same reason.
resources:
  - namespace.yaml
  - external-secret.yaml
  - external-secret-ghcr.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - image-automation.yaml
