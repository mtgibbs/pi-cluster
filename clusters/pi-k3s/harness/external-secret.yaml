# The shared bearer token workers present when reporting.
#
# A NEW 1Password item, and the graph was walked before minting one (docs/secrets-map.md).
# Nothing existing fits: this is not a pull token, not a GitHub identity, and not a third-party
# API key — it is this service's own shared secret with the workers that report to it, which the
# map calls a genuinely per-workload credential and the one case where minting is right.
#
# Deliberately NOT shared with the dispatch API's HARNESS_API_TOKEN. Both are "harness control
# plane", so one identity per role would argue for sharing — but the dispatch API creates compute,
# and this one receives status. A token that leaks from a reporting worker should not also be able
# to launch Kubernetes Jobs, and every worker in the fleet carries this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-coordinator
  namespace: harness
spec:
  # 24h to match the other 58 ExternalSecrets in this cluster. These hold static tokens; nothing
  # rotates them hourly, so a 1h poll bought no freshness and cost 24x the 1Password calls.
  # On 2026-09-01 the onepassword ClusterSecretStore hit "rate limit exceeded" and stayed
  # InvalidProviderConfig for hours. Exactly the five ExternalSecrets set to 1h were the five
  # failing; all 58 at 24h were unaffected. ESO re-validates the store on each failed reconcile,
  # and that validation is itself a rate-limited call — so the fast pollers kept the quota
  # exhausted and the store could never recover on its own.
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harness-coordinator
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: harness-coordinator/token
