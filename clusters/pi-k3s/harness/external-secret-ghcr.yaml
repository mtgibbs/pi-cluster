# Reuses the cluster's EXISTING shared GHCR read token — the same one Flux image-automation uses to
# scan private repos and private-exit-node uses to pull. Identical pattern to
# clusters/pi-k3s/private-exit-node/external-secret.yaml. No new credential: one 1Password item
# (ghcr-read-token) is the whole cluster's "pull private packages" identity, materialized as a
# namespaced ghcr-pull-secret wherever a private image lands.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: harness
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"mtgibbs","password":"{{ .token }}","auth":"{{ printf "mtgibbs:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-read-token/token
