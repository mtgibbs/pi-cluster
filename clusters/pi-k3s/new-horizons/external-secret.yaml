# LiteLLM virtual key for nh score / nh fetch-jd distill (scoped to coder models on the Beelink),
# same pattern as review-hub + local-llm-mcp. PREREQ: mint the key in LiteLLM and store it at
# op://pi-cluster/new-horizons/litellm-key before this will sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: new-horizons-secrets
  namespace: new-horizons
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: new-horizons-secrets
    creationPolicy: Owner
  data:
    - secretKey: litellm-key
      remoteRef:
        key: new-horizons/litellm-key
