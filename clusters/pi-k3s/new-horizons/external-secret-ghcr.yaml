# SHARED, CLUSTER-WIDE image-pull identity — NOT a per-service cred. One read-only GHCR token
# (role: "pull private packages") lets any deployable use a private image. New private service =
# reference this same 1Password item from its own namespace; zero new identities.
#
# PREREQ (one-time, cluster-wide): create a read-only GitHub token (fine-grained: Packages -> read,
# or a classic PAT with read:packages) and store:
#   op://pi-cluster/ghcr-pull/username   (the GitHub username, e.g. mtgibbs)
#   op://pi-cluster/ghcr-pull/token      (the read-only token)
#
# The ExternalSecret is materialized per-namespace (imagePullSecrets are namespaced) — copy this file
# into any future private service's dir, unchanged. Only the k8s Secret is per-namespace; the
# credential is one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: new-horizons
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-pull/username
    - secretKey: token
      remoteRef:
        key: ghcr-pull/token
