apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-horizons
resources:
  - namespace.yaml
  - external-secret.yaml
  # Materializes the SHARED ghcr-pull-secret. Dropped when phase 3 branched off phase 2 before this
  # file existed; without it the private image is an ImagePullBackOff.
  - external-secret-ghcr.yaml
  # Restored 2026-08-02, matrix-token only: the dedicated @new-horizons bot exists and
  # op://pi-cluster/new-horizons/matrix-token is provisioned. ntfy-token remains out of the
  # manifest (field not provisioned — an absent-field ref would sit red forever, the false
  # alarm this file was once dropped for); see the header comment in the manifest itself.
  - external-secret-push.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# alerter.py (the Phase-3 push sidecar's script) as a stable-named ConfigMap.
configMapGenerator:
  - name: new-horizons-alerter
    files:
      - alerter/alerter.py
generatorOptions:
  disableNameSuffixHash: true
