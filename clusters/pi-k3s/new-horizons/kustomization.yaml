apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-horizons
resources:
  - namespace.yaml
  - external-secret.yaml
  # Materializes the SHARED ghcr-pull-secret. Dropped when phase 3 branched off phase 2 before this
  # file existed; without it the private image is an ImagePullBackOff.
  - external-secret-ghcr.yaml
  # NO external-secret-push.yaml. The Phase-3 ntfy/Matrix tokens are not provisioned, and an
  # ExternalSecret pointing at absent 1Password fields never syncs — it just sits red forever.
  # Both refs are `optional: true` on the pod and the alerter skips an unconfigured backend, so
  # the push path is dormant either way; this way it is dormant WITHOUT a standing false alarm.
  # To enable pings: add op://pi-cluster/new-horizons/{ntfy-token,matrix-token}, restore the
  # manifest (see git history for this path), and set MATRIX_ROOM_ID in deployment.yaml.
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# alerter.py (the Phase-3 push sidecar's script) as a stable-named ConfigMap.
configMapGenerator:
  - name: new-horizons-alerter
    files:
      - alerter/alerter.py
generatorOptions:
  disableNameSuffixHash: true
