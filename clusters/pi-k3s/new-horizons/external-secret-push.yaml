# Phase 3 push tokens — SEPARATE from new-horizons-secrets so an unprovisioned token here can never
# break the required litellm-key sync (phases 1-2).
#
# matrix-token ONLY, for now: @new-horizons (dedicated Matrix bot user, registered 2026-08-02)
# posts to the private #jobs room; its token lives at op://pi-cluster/new-horizons/matrix-token.
# ntfy-token is DELIBERATELY absent — that 1Password field is not provisioned, and an
# ExternalSecret referencing an absent field never syncs, it just sits red forever (the standing
# false alarm this manifest was once dropped for — see 669a871). To add ntfy pings later: create
# op://pi-cluster/new-horizons/ntfy-token, then add its data entry back here. The pod's NTFY_TOKEN
# secretKeyRef is optional and the alerter skips an unconfigured backend, so ntfy stays quietly
# dormant meanwhile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: new-horizons-push-secrets
  namespace: new-horizons
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: new-horizons-push-secrets
    creationPolicy: Owner
  data:
    - secretKey: matrix-token
      remoteRef:
        key: new-horizons/matrix-token
