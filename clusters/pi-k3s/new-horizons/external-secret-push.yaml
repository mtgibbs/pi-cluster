# Phase 3 push tokens — SEPARATE from new-horizons-secrets so an unprovisioned token here can never
# break the required litellm-key sync (phases 1-2). Both keys are OPTIONAL on the pod
# (secretKeyRef optional: true) and the alerter skips a backend whose token/room is unset — so the
# push simply stays quiet until you fill these in.
# PREREQ (only if you want the pings): store the fields in 1Password:
#   op://pi-cluster/new-horizons/ntfy-token    (only if your ntfy topic is protected)
#   op://pi-cluster/new-horizons/matrix-token  (a Matrix bot access token) + set MATRIX_ROOM_ID in the Deployment
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: new-horizons-push-secrets
  namespace: new-horizons
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: new-horizons-push-secrets
    creationPolicy: Owner
  data:
    - secretKey: ntfy-token
      remoteRef:
        key: new-horizons/ntfy-token
    - secretKey: matrix-token
      remoteRef:
        key: new-horizons/matrix-token
