---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    installCRDs: true
    serviceAccount:
      create: true
      name: external-secrets
    # Use GitHub Container Registry instead of oci.external-secrets.io
    image:
      repository: ghcr.io/external-secrets/external-secrets
    webhook:
      image:
        repository: ghcr.io/external-secrets/external-secrets
    certController:
      image:
        repository: ghcr.io/external-secrets/external-secrets

    # --- added after the 2026-08-11 WASM incident (docs/incidents/) ---
    # The controller had NO metrics scraped and NO resource limits. It ran 40+ hours
    # with a dead 1Password provider client and nothing noticed, because there was
    # nothing to notice WITH.
    #
    # serviceMonitor: without this the :8080 metrics endpoint exists but Prometheus
    # never scrapes it, so any alert rule silently never fires. `release` label must
    # match the kube-prometheus serviceMonitorSelector (same convention the
    # PrometheusRules use).
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus

    # Limits are deliberate SELF-HEALING, not capacity planning. The failure mode was a
    # long-lived process whose embedded WASM runtime stopped being able to allocate —
    # the pod stayed Ready with 0 restarts and degraded silently forever. A memory
    # ceiling converts that slow death into an OOM-restart, which recovers on its own.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
