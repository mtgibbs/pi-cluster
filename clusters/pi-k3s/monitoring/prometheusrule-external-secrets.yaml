# Alerting for External Secrets Operator, added after the 2026-08-11 incident where
# ClusterSecretStore/onepassword died and 53 of 56 ExternalSecrets failed to refresh for
# 40+ hours with nobody notified. See docs/incidents/2026-08-11-eso-onepassword-wasm.md.
#
# Two properties this incident argued for:
#
#  1. ALERT ON THE STORE, NOT JUST THE SECRETS. One dead store produced 53 identical
#     downstream failures. Paging on each would be noise; the store is the cause and the
#     single actionable signal.
#  2. THE SYMPTOM WAS SILENCE, NOT NOISE. The failing secrets kept their last-synced
#     values, so every workload stayed up and nothing looked wrong. Only a metric on the
#     REFRESH path can see this — which is why the ServiceMonitor in
#     external-secrets/helmrelease.yaml is a hard prerequisite for this file.
#
# NOTE on blast radius: Alertmanager's own routing creds (alertmanager-discord,
# vector-ntfy) are themselves ESO-managed. They survive a store outage because
# materialised Secrets persist — but that is why these alerts must never be made to
# DEPEND on a fresh secret read.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: external-secrets
    release: kube-prometheus  # Match Prometheus Operator selector
spec:
  groups:
    - name: external-secrets.rules
      rules:
        # PRIMARY. A store that can't validate serves nothing. In the 2026-08-11 incident
        # this was the single true statement; everything else was an echo of it.
        - alert: ClusterSecretStoreNotReady
          expr: |
            clustersecretstore_status_condition{condition="Ready",status="true"} == 0
            or
            clustersecretstore_status_condition{condition="Ready",status="false"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "ClusterSecretStore {{ $labels.name }} is not ready — no secret can sync"
            description: >-
              ClusterSecretStore {{ $labels.name }} has been not-ready for 15m. Every ExternalSecret
              backed by it is failing to refresh. Existing Kubernetes Secrets KEEP their last-synced
              values, so workloads stay up and this is INVISIBLE without this alert — but rotation is
              dead and no new secret can be created. Known failure mode (2026-08-11): the
              onepasswordSDK provider runs the 1Password SDK as an Extism/WASM plugin and
              `init_client()` trapped with "out of bounds memory access"; the pod showed 0 restarts
              and stayed Ready. First move is `kubectl -n external-secrets rollout restart
              deploy/external-secrets` — a retry inside the same process does NOT reset the WASM
              host memory, only a process restart does. If it fails identically after the restart,
              suspect the bootstrap token in external-secrets/onepassword-service-account.
              Runbook: .claude/skills/secrets-management/SKILL.md

        # SECONDARY. Catches partial failure the store-level alert can't see — a store that
        # validates fine while individual items fail (renamed 1Password item, revoked vault
        # access, the "multiple labels with the same key" trap).
        - alert: ExternalSecretsFailingToSync
          expr: |
            count(externalsecret_status_condition{condition="Ready",status="false"} == 1) >= 3
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} ExternalSecrets have been failing to sync for 30m"
            description: >-
              Three or more ExternalSecrets are not ready. If ClusterSecretStoreNotReady is ALSO
              firing, fix the store first — this alert is then just its echo. If the store is
              healthy, the failures are per-item: check the 1Password item name, the vault
              (must be `pi-cluster`), and that the service account can see it.

        # The operator being gone is a different, louder problem — and it would silence both
        # alerts above, so it needs its own detector.
        - alert: ExternalSecretsOperatorDown
          expr: |
            absent(up{job=~".*external-secrets.*"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "External Secrets Operator is not being scraped"
            description: >-
              No healthy scrape target for the ESO controller for 10m — the operator is down, or the
              ServiceMonitor stopped matching. Either way the two alerts above are blind while this
              fires, which is exactly the gap that let the 2026-08-11 incident run 40+ hours.
