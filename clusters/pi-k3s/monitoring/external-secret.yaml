apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-secret
    creationPolicy: Owner
    template:
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager/discord-alerts-webhook-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
  data:
    # The external dead-man's-switch ping URL (a healthchecks.io check URL).
    # 1Password item "healthchecks", field "watchdog-ping-url", vault pi-cluster.
    - secretKey: ping-url
      remoteRef:
        key: healthchecks/watchdog-ping-url
---
# Bearer token Alertmanager sends to n8n's `agent-alert` webhook (receiver
# n8n-agents in helmrelease.yaml). Mounted into the Alertmanager pod via
# alertmanagerSpec.secrets and read through credentials_file — never inlined
# into the rendered config. n8n validates the same value (its webhook Header
# Auth credential). Its own item, not n8n/webhook-token: that one is held by
# the Cloudflare Email Worker at the public edge, and a leak there must not let
# anyone start agent runs. 1Password item "n8n-agent-alert-webhook", field
# "token", vault pi-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-n8n-agents
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-n8n-agents
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: n8n-agent-alert-webhook/token
