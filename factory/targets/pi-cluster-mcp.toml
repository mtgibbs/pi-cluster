# A factory target: a repo the factory may act on. The intake and submit.py refuse any target
# without a file here. Changing `stage` (the earn-out) is Matt's decision, made in a PR to this
# file — ledger.mjs only reports eligibility, and a factory run cannot reach this file (its
# sandbox clones only the target repo). See docs/design/factory-intake.md.

repo = "mtgibbs/pi-cluster-mcp"
workflow = "mcp"                 # factory/mcp/: workflow.fabro, workflow.toml, prompts/

# Earn-out stage (factory/README.md "Earning out"). 0 = shadow: the factory never merges.
stage = 0

# Who may hand this target a problem: "human", "agent:<name>", or "agent:*".
origins = ["human", "agent:ops-investigator", "agent:mcp-researcher"]

# Intake admission (in-cluster requests only; the laptop is not limited by these).
max_open = 2                     # unfinished factory runs + open `factory` PRs on the repo
runs_per_day = 3                 # submissions per UTC day
cooldown_days = 14               # a request key that ended held/closed waits this long
intake_profile = "hybrid-gemini" # models.toml profile for intake runs (hosted judges; spends Fabro's LiteLLM budget)

# Which research-agent plans n8n routes here: regexes over the plan's fingerprint.resource
# (scripts/agentrunner/CONTRACT.md §5a). First feeder: MCP tool defects.
accepts = ['^mcp-homelab/McpTool/[A-Za-z0-9_]+$']
